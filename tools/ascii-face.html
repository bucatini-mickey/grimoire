<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Face Tuner</title>
<!--
	ascii-face.html - the webcam as moving ASCII in character cells, the way Grimoire's village shows faces,
	with sliders to tune the drawing. One file, no libraries, nothing sent anywhere: open it in Chrome or
	Edge (double-click the file is fine) and allow the camera. No camera? Open a video file, or use the
	moving test picture.

	The drawing, as in the game (src/town/faces.ts): the picture is cropped square (zoom and height below),
	mirrored, and shrunk to a grid of samples, two per cell (a cell is twice as tall as wide, so its top half
	and bottom half are sampled apart). The samples are stretched between a black point and a white point
	(percentiles of the frame, so a dim room still reads), bent by gamma, sharpened, and squeezed to 16
	levels (one hex digit each: what the game sends). Each cell's glyph comes from its two halves: when one
	half is much brighter than the other (the shape threshold), a glyph whose ink sits high (` ' ") or low
	(. , o) in the cell; otherwise a glyph from the density ramp. Its ink is the brighter half's level.

	"Copy settings" gives the numbers to paste back to Claude, to make them the game's.
-->
<style>
	:root { --bg: #15110d; --panel: #1f1812; --ink: #e9dcc0; --rule: #8a6a3a; --dim: #8d7f68; --accent: #c9a25a; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace; }
	body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; padding: 12px 16px; }
	@media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } }
	#stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; }
	#row { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
	pre { margin: 0; line-height: 1.2; white-space: pre; user-select: none; }
	#game { font-size: 16px; padding: 6px 8px; border: 1px solid var(--rule); background: #0d0a08; }
	.cap { color: var(--dim); font-size: 11px; text-align: center; }
	video { display: none; width: 220px; transform: scaleX(-1); border: 1px solid var(--rule); }
	video.shown { display: block; }
	canvas { display: none; }
	#panel { background: var(--panel); border: 1px solid var(--rule); padding: 10px 12px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
	#panel h2 { margin: 0; font-size: 13px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
	label.s { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
	label.s input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
	label.s output { color: var(--accent); font-variant-numeric: tabular-nums; }
	.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
	button { font: inherit; font-size: 12px; background: #241b12; color: var(--ink); border: 1px solid var(--rule); padding: 4px 8px; cursor: pointer; }
	button.on { background: var(--rule); color: var(--bg); }
	button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
	#note { color: var(--dim); font-size: 11px; }
	textarea { width: 100%; height: 70px; background: #0d0a08; color: var(--ink); border: 1px solid var(--rule); font: inherit; font-size: 11px; }
</style>
</head>
<body>
<div id="stage">
	<div id="row">
		<div><pre id="face" aria-label="Your face drawn in ASCII, large"></pre></div>
		<video id="cam" playsinline muted></video>
	</div>
	<div><pre id="game" aria-label="The same face at the game's size"></pre><div class="cap">as the village shows it (12x6 cells)</div></div>
	<div id="note">Starting the camera...</div>
</div>
<div id="panel">
	<h2>Picture</h2>
	<div id="sliders1"></div>
	<h2>Drawing</h2>
	<div id="sliders2"></div>
	<div class="toggles" id="toggles"></div>
	<h2>Source</h2>
	<div class="toggles">
		<button id="useCam" type="button">Camera</button>
		<button id="useTest" type="button">Test picture</button>
		<button id="pickFile" type="button">Video file...</button>
		<input id="file" type="file" accept="video/*" hidden>
	</div>
	<h2>Settings</h2>
	<div class="toggles"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
	<textarea id="out" readonly aria-label="Settings to paste back"></textarea>
</div>
<video id="clip" playsinline muted loop hidden></video>
<canvas id="cv"></canvas>
<script>
'use strict';
const DEFAULTS = { cols: 12, fps: 12, zoom: 0.8, lift: 0.06, black: 4, white: 96, gamma: 1, sharpen: 0.7, shape: 5, colour: true, invert: false, shaped: true, real: false };
const SLIDERS = [
	['sliders1', 'zoom', 'Crop (1 = whole picture)', 0.3, 1, 0.01],
	['sliders1', 'lift', 'Crop height (up +)', -0.3, 0.3, 0.01],
	['sliders1', 'black', 'Black point (percentile)', 0, 30, 1],
	['sliders1', 'white', 'White point (percentile)', 70, 100, 1],
	['sliders1', 'gamma', 'Gamma (higher: darker mids)', 0.3, 2.5, 0.05],
	['sliders2', 'cols', 'Columns (game: 12)', 6, 96, 1],
	['sliders2', 'sharpen', 'Sharpen', 0, 2, 0.05],
	['sliders2', 'shape', 'Shape threshold (levels)', 1, 15, 1],
	['sliders2', 'fps', 'Frames a second', 2, 30, 1]
];
const TOGGLES = [['shaped', 'Shape glyphs'], ['colour', 'Ink'], ['invert', 'Invert'], ['real', 'Real picture']];
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('asciiFace') || '{}')); } catch (e) { /* none kept */ }
const save = () => { try { localStorage.setItem('asciiFace', JSON.stringify(S)); } catch (e) { /* private mode */ } };

const RAMP = ' .,:;-=+*oa#%@';
const DENSE = ' .:-=+*#%@';
/** Inks from dark to bright (candlelit vellum), by level 0..15. */
const INKS = ['#15110d', '#2a2017', '#3d2e20', '#503c29', '#634a32', '#76593c', '#8a6a47', '#9d7b53', '#ae8c60', '#bd9c6f', '#cbad80', '#d7bd92', '#e2cda6', '#ecdcba', '#f4e9cf', '#fbf4e4'];

const $ = (id) => document.getElementById(id);
const pre = $('face'), game = $('game'), note = $('note'), cam = $('cam'), clip = $('clip'), cv = $('cv');
const cx = cv.getContext('2d', { willReadFrequently: true });
let source = 'cam';

/** The cropped, mirrored picture as w x h brightness samples (0..255). */
function sample(src, sw, sh, w, h) {
	cv.width = w; cv.height = h;
	const side = Math.min(sw, sh) * S.zoom;
	const sx = (sw - side) / 2, sy = Math.max(0, Math.min(sh - side, (sh - side) / 2 - side * S.lift));
	cx.save(); cx.translate(w, 0); cx.scale(-1, 1);
	cx.drawImage(src, sx, sy, side, side, 0, 0, w, h);
	cx.restore();
	const px = cx.getImageData(0, 0, w, h).data;
	const v = new Float32Array(w * h);
	for (let i = 0; i < v.length; i++) v[i] = 0.3 * px[i * 4] + 0.59 * px[i * 4 + 1] + 0.11 * px[i * 4 + 2];
	return v;
}

/** Samples to levels 0..15: stretched black to white point, gamma, sharpened (the game's toFrame). */
function levels(v, w, h) {
	const sorted = Float32Array.from(v).sort();
	const lo = sorted[Math.floor((v.length - 1) * S.black / 100)], hi = sorted[Math.floor((v.length - 1) * S.white / 100)];
	const span = Math.max(12, hi - lo);
	const n = (i) => Math.pow(Math.min(1, Math.max(0, (v[i] - lo) / span)), S.gamma);
	const out = new Uint8Array(v.length);
	for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
		const i = x + y * w;
		let s = 0, k = 0;
		for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
			const xx = x + dx, yy = y + dy;
			if (xx >= 0 && yy >= 0 && xx < w && yy < h) { s += n(xx + yy * w); k++; }
		}
		let b = Math.min(1, Math.max(0, n(i) + (n(i) - s / k) * S.sharpen));
		if (S.invert) b = 1 - b;
		out[i] = Math.round(b * 15);
	}
	return out;
}

/** A cell from its two halves: [glyph, ink level]. */
function cell(t, b) {
	const level = Math.max(t, b);
	if (level < 2) return [' ', level];
	const d = t - b;
	if (d >= S.shape) return [t >= 11 ? '"' : t >= 7 ? "'" : '`', level];
	if (d <= -S.shape) return [b >= 11 ? 'o' : b >= 7 ? ',' : '.', level];
	return [DENSE[Math.round(((t + b) / 30) * (DENSE.length - 1))], level];
}

const esc = (c) => (c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c);
/** Draw cols x rows cells into a <pre>, runs of one ink in one span (as pterm draws). */
function draw(el, src, sw, sh, cols) {
	const rows = Math.max(1, Math.round(cols / 2));
	let grid;
	if (S.shaped) {
		const lv = levels(sample(src, sw, sh, cols, rows * 2), cols, rows * 2);
		grid = (x, y) => cell(lv[x + 2 * y * cols], lv[x + (2 * y + 1) * cols]);
	} else {
		const lv = levels(sample(src, sw, sh, cols, rows), cols, rows);
		grid = (x, y) => { const k = lv[x + y * cols]; return [RAMP[Math.round((k * (RAMP.length - 1)) / 15)], k]; };
	}
	const out = [];
	for (let y = 0; y < rows; y++) {
		let line = '', run = '', ink = -1;
		const flush = () => { if (run) line += S.colour ? `<span style="color:${INKS[ink]}">${run}</span>` : run; run = ''; };
		for (let x = 0; x < cols; x++) {
			const [ch, k] = grid(x, y);
			const want = S.colour ? k : 0;
			if (want !== ink) { flush(); ink = want; }
			run += esc(ch);
		}
		flush();
		out.push(line);
	}
	el.innerHTML = out.join('\n');
	return rows;
}

/** No camera: a face-like test picture, moving, so the drawing can be seen anyway. */
const test = document.createElement('canvas');
function testFrame(t) {
	test.width = 160; test.height = 160;
	const g = test.getContext('2d');
	g.fillStyle = '#222'; g.fillRect(0, 0, 160, 160);
	g.fillStyle = '#d8bfa0'; g.beginPath(); g.ellipse(80, 86, 42, 54, 0, 0, Math.PI * 2); g.fill();
	g.fillStyle = '#3a2614'; g.beginPath(); g.ellipse(80, 50, 46, 26, 0, Math.PI, 0); g.fill();
	g.fillStyle = '#2a1a10';
	const blink = (t / 3200) % 1 < 0.05 ? 1 : 6;
	for (const ex of [64, 96]) { g.beginPath(); g.ellipse(ex + Math.sin(t / 700) * 3, 76, 7, blink, 0, 0, Math.PI * 2); g.fill(); }
	g.fillStyle = '#b89070'; g.fillRect(77, 80, 6, 18);
	g.fillStyle = '#5a2a20'; g.beginPath(); g.ellipse(80, 114, 13, 3 + Math.abs(Math.sin(t / 300)) * 5, 0, 0, Math.PI * 2); g.fill();
	return test;
}

let last = 0;
function frame(t) {
	requestAnimationFrame(frame);
	if (t - last < 1000 / S.fps) return;
	last = t;
	const live = source === 'cam' && cam.readyState >= 2, file = source === 'file' && clip.readyState >= 2;
	const [src, sw, sh] = live ? [cam, cam.videoWidth, cam.videoHeight] : file ? [clip, clip.videoWidth, clip.videoHeight] : [testFrame(t), 160, 160];
	const rows = draw(pre, src, sw, sh, S.cols);
	draw(game, src, sw, sh, 12);
	const w = innerWidth > 760 ? innerWidth - 360 : innerWidth - 40;
	const h = innerHeight - 220;
	pre.style.fontSize = Math.max(4, Math.min((w - (S.real ? 240 : 0)) / (S.cols * 0.6), h / (rows * 1.2))).toFixed(1) + 'px';
	cam.className = S.real && live ? 'shown' : '';
	note.textContent = `${live ? 'Camera' : file ? 'Video file' : 'Test picture'} · ${S.cols}x${rows} cells · ${S.cols * rows * (S.shaped ? 2 : 1)} bytes a frame as the game would send it · nothing leaves this page`;
}

function controls() {
	for (const box of ['sliders1', 'sliders2']) $(box).innerHTML = '';
	for (const [box, key, label, min, max, step] of SLIDERS) {
		const l = document.createElement('label'); l.className = 's';
		const id = 's-' + key;
		l.innerHTML = `<span>${label}</span><output for="${id}">${S[key]}</output><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${S[key]}">`;
		const input = l.querySelector('input'), out = l.querySelector('output');
		input.addEventListener('input', () => { S[key] = +input.value; out.textContent = input.value; save(); settings(); });
		$(box).appendChild(l);
	}
	const tg = $('toggles'); tg.innerHTML = '';
	for (const [key, label] of TOGGLES) {
		const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
		b.className = S[key] ? 'on' : '';
		b.onclick = () => { S[key] = !S[key]; save(); controls(); settings(); };
		tg.appendChild(b);
	}
	$('useCam').className = source === 'cam' ? 'on' : '';
	$('useTest').className = source === 'test' ? 'on' : '';
	$('pickFile').className = source === 'file' ? 'on' : '';
}
const settings = () => { $('out').value = JSON.stringify(S); };

$('copy').onclick = async () => {
	settings();
	try { await navigator.clipboard.writeText($('out').value); note.textContent = 'Settings copied.'; }
	catch (e) { $('out').select(); note.textContent = 'Select the settings below and copy them.'; }
};
$('reset').onclick = () => { S = { ...DEFAULTS }; save(); controls(); settings(); };
$('useTest').onclick = () => { source = 'test'; controls(); };
$('pickFile').onclick = () => $('file').click();
$('file').onchange = () => {
	const f = $('file').files[0];
	if (!f) return;
	clip.src = URL.createObjectURL(f);
	clip.play().catch(() => {});
	source = 'file'; controls();
};
$('useCam').onclick = startCam;

async function startCam() {
	source = 'cam'; controls();
	if (cam.srcObject) return;
	try {
		cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
		await cam.play();
	} catch (e) {
		source = 'test'; controls();
		note.textContent = 'No camera (' + (e && e.name || 'refused') + '): showing the test picture. Open a video file to try a real face.';
	}
}

controls();
settings();
requestAnimationFrame(frame);
startCam();
</script>
</body>
</html>
